version: 2
updates:
  # Version updates are disabled: open-pull-requests-limit 0 stops Dependabot
  # from opening routine "keep it fresh" pull requests. Security updates are a
  # separate mechanism driven by advisories, they ignore this limit and keep
  # working. The groups below apply to those, so a wave of advisories arrives
  # as a single pull request instead of one per package.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
